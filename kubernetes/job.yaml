kind: Job
apiVersion: batch/v1
metadata:
  name: demo-job
  namespace: nginx
spec:
  completions: 1
  parallelism: 2
  template:
    metadata:
      name: demo-job-pod
      labels:
        app: demo-job
    spec:
      containers:
      - name: batch-container
        image: busybox:latest
        command: ["sh","-c","echo Hello && sleep 10"]
      restartPolicy: Never
